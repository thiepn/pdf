name: D1 workspace UI qualification

on:
  pull_request:
    paths:
      - src/views/HomePage.tsx
      - src/product/studio-workspace-d1.css
      - src/product/product.css
      - tests/e2e/d1-home-workspace.spec.ts
      - .github/workflows/d1-workspace-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: D1 desktop and phone functional and layout qualification
        run: npx playwright test tests/e2e/d1-home-workspace.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - name: Preserve reviewable D1 screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d1-workspace-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
