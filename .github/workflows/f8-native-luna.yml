name: F8 native Luna qualification
on:
  pull_request:
    paths:
      - "src/automation/nativeLunaAccount.ts"
      - "src/automation/nativeLunaClient.ts"
      - "src/automation/NativeLunaControls.tsx"
      - "src/automation/AIWorkflowPlanner.tsx"
      - "src/automation/aiWorkflowPlanner.css"
      - "src/main.tsx"
      - "tests/unit/f8NativeLuna.test.ts"
      - "tests/e2e/f8-native-luna.spec.mjs"
      - ".github/workflows/f8-native-luna.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VITE_PDF_CORE_URL: https://core.example/
      VITE_PDF_ACCOUNT_SUPABASE_URL: https://account.example/
      VITE_PDF_ACCOUNT_PUBLIC_KEY: public-test-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/unit/f8NativeLuna.test.ts tests/unit/f7AIWorkflowPlanning.test.ts tests/unit/f6WorkflowComposer.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test native authenticated UI and human approval
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: "/pdf/"
        run: npx playwright test tests/e2e/f8-native-luna.spec.mjs --project=chromium --workers=1 --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: f8-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
