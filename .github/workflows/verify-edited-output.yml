name: Final task workflow output verification
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/verify-edited-output.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          data = ''
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'afcfb889887abdd184799d01a41ced6158de2b0f91d605841ff65a82e26f0f2d'
          Path('/tmp/output.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/output.patch
          git apply --unidiff-zero --index /tmp/output.patch
          test "$(git diff --cached --name-only)" = 'tests/e2e/task-first-frictionless.spec.mjs'
          git rm .github/workflows/verify-edited-output.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify current text annotation contents, appearance and rendered output'
          test "$(git ls-remote origin refs/heads/redesign/task-first-experience | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/redesign/task-first-experience
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement requirements-phase11.txt
      - run: sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends fonts-noto-core
      - run: npm ci --no-audit --no-fund
      - run: npm run release:web
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Real PDF workflows without skipped tests or retries
        run: PLAYWRIGHT_SKIP_BUILD=1 npx playwright test tests/e2e/task-first- tests/e2e/everyday-workflows.spec.mjs --project=chromium --project=firefox --project=webkit --workers=2 --retries=0 --max-failures=8
      - name: Record qualified source revision
        if: always()
        run: |
          git rev-parse HEAD > qualification-sha.txt
          git archive --format=tar.gz HEAD > /tmp/pdf-qualified-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-qualified-task-evidence
          path: |
            qualification-sha.txt
            /tmp/pdf-qualified-source.tar.gz
            playwright-report/
            test-results/
            source-audit-report.json
            docs/phase-11/corpus-validation-report.json
            docs/phase-28/adversarial-corpus-report.json
          retention-days: 7
