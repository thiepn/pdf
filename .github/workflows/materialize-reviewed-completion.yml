name: Materialize reviewed completion
on:
  push:
    branches: [redesign/task-first-experience]
    paths: ['.maintenance/release-edits.*']
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'thiepn'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the exact locally tested UTF-8 edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          chunks = sorted(Path('.maintenance').glob('release-edits.*'))
          assert len(chunks) == 7, 'Incomplete reviewed source transport'
          compressed = base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '355dd2c77c98c8d0785931281771b820cb1ddc2af6e87f68e36e9390897496fc', 'Transport checksum mismatch'
          payload = json.loads(lzma.decompress(compressed))
          assert payload['base'] == '576663647a8eed2c8f5b21e3e4c7eeac602df8b8'
          subprocess.run(['git','merge-base','--is-ancestor',payload['base'],'HEAD'], check=True)
          outputs = {}
          for item in payload['files']:
              name = item['path']; path = Path(name)
              assert not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
              assert name.startswith(('src/','tests/e2e/','tests/unit/')) and not path.is_symlink()
              if item['before'] is None:
                  assert not path.exists(), f'New source already exists: {name}'
                  value = item['content']
              else:
                  raw = path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == item['before'], f'Source changed since review: {name}'
                  value = raw.decode('utf-8'); previous_end = 0
                  for start,end,replacement in item['edits']:
                      assert isinstance(start,int) and isinstance(end,int) and previous_end <= start <= end <= len(value)
                      previous_end = end
                  for start,end,replacement in reversed(item['edits']):
                      value = value[:start] + replacement + value[end:]
              encoded = value.encode('utf-8')
              assert hashlib.sha256(encoded).hexdigest() == item['after'], f'Reviewed output mismatch: {name}'
              outputs[path] = encoded
          for path,encoded in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(encoded)
          subprocess.run(['git','add','--'] + [str(p) for p in outputs], check=True)
          subprocess.run(['git','rm','--'] + [str(p) for p in chunks], check=True)
          print(f'Applied and individually SHA-256-verified {len(outputs)} reviewed source/test files.')
          PY
      - name: Publish reviewed source without overwriting concurrent branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: complete direct PDF workflows and harden file, form and scan recovery'
          git push origin HEAD:redesign/task-first-experience
          git rev-parse HEAD
