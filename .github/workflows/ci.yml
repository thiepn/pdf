name: PDF Studio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.16.0
  NPM_VERSION: 10.9.2
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}

jobs:
  phase11-stability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install external-reader validation tools
        run: python -m pip install --requirement requirements-phase11.txt
      - name: Run dependency-independent stability gate
        run: npm run gate:phase11
      - name: Upload corpus validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase11-corpus-evidence
          path: |
            docs/phase-11/corpus-validation-report.json
            tests/corpus/generated/manifest.json

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: phase11-stability-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pin npm toolchain
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - name: Resolve deterministic build metadata
        run: echo "BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Install external-reader validation tools
        run: python -m pip install --requirement requirements-phase11.txt
      - name: Audit lockfile and toolchain
        run: npm run audit:lockfile && npm run audit:toolchain
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate installed dependency tree
        run: npm run audit:tree
      - name: v6.1.0 non-browser release qualification
        run: npm run release:web
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
      - name: Fingerprint verified distribution
        run: node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-first.sha256
      - name: Reproducible production build
        run: |
          rm -rf dist
          npm run build:verified
          node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-second.sha256
          diff -u /tmp/dist-first.sha256 /tmp/dist-second.sha256
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
      - name: High-severity dependency security gate
        run: npm run audit:security
      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: phase30-verified-dist
          path: dist
      - name: Upload source audit
        uses: actions/upload-artifact@v7
        with:
          name: phase30-source-audit
          path: source-audit-report.json

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [phase11-stability-gate, validate]
    steps:
      - uses: actions/checkout@v7
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pin npm toolchain
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate browser corpora
        run: |
          python -m pip install --requirement requirements-phase11.txt
          python scripts/phase11/generate_corpus.py
          python scripts/phase28/generate_adversarial_corpus.py
          python scripts/phase28/validate_adversarial_corpus.py
      - name: Download exact verified distribution
        uses: actions/download-artifact@v8
        with:
          name: phase30-verified-dist
          path: dist
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression and privacy checks against verified dist
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          PLAYWRIGHT_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase30-playwright-report
          path: playwright-report
          if-no-files-found: ignore
