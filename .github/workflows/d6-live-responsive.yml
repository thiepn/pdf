name: D6 real mobile and tablet qualification

on:
  pull_request:
    paths:
      - src/views/EditorPage.tsx
      - src/product/studio-responsive-d6-live.css
      - src/product/product.css
      - tests/e2e/d6-live-mobile-panels.spec.ts
      - .github/workflows/d6-live-responsive.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d6-real-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real mobile and tablet editor checks
        run: npx playwright test tests/e2e/d6-live-mobile-panels.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - name: Capture screenshots and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d6-real-responsive-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
