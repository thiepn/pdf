name: Deploy PDF Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 22.16.0
  NPM_VERSION: 10.9.2
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployment-policy:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.policy.outputs.should_deploy }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Refuse same-version candidate overwrite of Stable Pages without failing qualification
        id: policy
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stable Pages preserved::Stable tag v${version} already exists. This main commit remains qualified by CI, but Pages is intentionally left on the published Stable release until package.json advances to a new version."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release-candidate deployment enabled::No Stable tag exists for v${version}; this main commit may qualify and deploy the v${version} release candidate."
          fi

  qualify-build:
    if: needs.deployment-policy.outputs.should_deploy == 'true'
    needs: deployment-policy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Unicode corpus font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core
      - name: Pin npm toolchain
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - name: Resolve deterministic build metadata
        run: echo "BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Install external-reader validation tools
        run: python -m pip install --requirement requirements-phase11.txt
      - name: Audit lockfile and toolchain
        run: npm run audit:lockfile && npm run audit:toolchain
      - name: Install exact JavaScript dependency graph
        run: npm ci --no-audit --no-fund
      - name: Validate dependency tree and source
        run: npm run audit:tree && npm run audit:dependencies && npm run audit:source && npm run audit:pages
      - name: Generate and validate P8 compatibility corpus
        run: |
          python scripts/p8/generate_compatibility_corpus.py
          python scripts/p8/validate_compatibility_corpus.py
      - name: Generate and validate P0 stress corpus
        run: |
          python scripts/p0/generate_stress_corpus.py
          python scripts/p0/validate_stress_corpus.py
      - name: Dependency-independent stability and release regressions
        run: |
          npm run gate:phase11
          npm run test:runtime:phase16
          npm run test:runtime:phase17
          npm run test:runtime:phase18
          npm run test:runtime:phase19
          npm run test:runtime:phase20
          npm run test:runtime:phase21
          npm run test:runtime:phase22
          npm run test:runtime:phase23
          npm run test:runtime:phase24
          npm run test:runtime:phase25
          npm run test:runtime:phase26
          npm run test:runtime:phase27
          npm run test:runtime:phase28
          npm run test:runtime:phase29
          npm run test:runtime:phase30
          npm run test:runtime:v6.0.1
          npm run test:runtime:v6.0.2
          npm run test:runtime:v6.0.3
          npm run test:runtime:v6.0.4
          npm run test:runtime:v6.0.5
          npm run test:runtime:v6.0.6
          npm run test:runtime:v6.1.0
          npm run audit:p9:release-candidate
          npm run test:runtime:v7.0.0
          npm run audit:phase30:migrations
          npm run audit:phase30:security
          npm run test:corpus:phase28
      - name: TypeScript and unit tests
        run: npm run typecheck && npm run test
      - name: Build verified repository-subpath distribution
        run: npm run build:verified
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          VITE_RELEASE_CHANNEL: release-candidate
      - name: Fingerprint first verified distribution
        run: node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-first.sha256
      - name: Reproducible deployment build
        run: |
          rm -rf dist
          npm run build:verified
          node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-second.sha256
          diff -u /tmp/dist-first.sha256 /tmp/dist-second.sha256
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          VITE_RELEASE_CHANNEL: release-candidate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser-qualify exact distribution before deployment
        run: npm run test:e2e -- --workers=1
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          PLAYWRIGHT_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
      - name: High-severity dependency security gate
        run: npm run audit:security
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: needs.deployment-policy.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [deployment-policy, qualify-build]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser-qualified artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: needs.deployment-policy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: [deployment-policy, deploy]
    timeout-minutes: 10
    steps:
      - name: Verify deployed application shell and PWA files
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.deployment-policy.outputs.version }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl --fail --location --retry 8 --retry-delay 5 "${base}"
          curl --fail --location --retry 8 --retry-delay 5 "${base}manifest.webmanifest" | grep -F 'PDF Studio' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}sw.js" | grep -F "${EXPECTED_VERSION}" > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-integrity.json" | grep -F 'fileCount' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F "\"version\": \"${EXPECTED_VERSION}\"" > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F '"channel": "release-candidate"' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}offline-assets.json" | grep -F 'assets' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}icons/icon-192.png" --output /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}icons/icon-512.png" --output /dev/null
