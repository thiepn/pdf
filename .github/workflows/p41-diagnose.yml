name: P41 failure diagnostic

on:
  push:
    branches:
      - ux/p41-product-wide-consumer-language

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Extract prior CI failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --allow-escape-sequences -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/jobs/99361606242/logs" > /tmp/p41.log
          echo "--- failure markers ---"
          grep -nE "FAIL|AssertionError|Error:|error TS|Process completed with exit code|not to|expected" /tmp/p41.log | tail -80 || true
          echo "--- final 100 lines ---"
          tail -100 /tmp/p41.log
