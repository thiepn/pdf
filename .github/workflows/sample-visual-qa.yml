name: Sample visual QA
on:
  push:
    branches: [design/better-showcase-sample]
    paths: ['.github/workflows/sample-visual-qa.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/better-showcase-sample
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/pdf-preview.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pdf-preview.log
          exit 1
      - name: Capture real sample workspace
        run: |
          mkdir -p sample-visual-qa
          cat > sample-visual-qa/capture.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser=await chromium.launch();
          const results=[];
          for (const viewport of [{name:'desktop',width:1440,height:960},{name:'mobile',width:390,height:844}]) {
            const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height},colorScheme:'light'});
            const page=await context.newPage();const row={viewport,errors:[]};page.on('pageerror',e=>row.errors.push(e.message));
            const response=await page.goto('http://127.0.0.1:4173/#/home',{waitUntil:'domcontentloaded'});row.status=response.status();
            await page.getByRole('button',{name:'Open sample',exact:true}).click();
            await page.getByRole('heading',{name:'northstar-launch-review',exact:true}).waitFor({timeout:20000});
            await page.getByRole('region',{name:'PDF page 1'}).waitFor({timeout:20000});
            await page.waitForTimeout(1200);
            row.text=(await page.getByRole('region',{name:'PDF page 1'}).innerText()).slice(0,4000);
            if(!row.text.includes('Launch Review')) throw new Error('Polished sample text did not render in the workspace');
            if(row.errors.length) throw new Error(`Page errors: ${row.errors.join('; ')}`);
            await page.screenshot({path:`sample-visual-qa/${viewport.name}.png`,fullPage:false});
            results.push(row);await context.close();
          }
          fs.writeFileSync('sample-visual-qa/results.json',JSON.stringify(results,null,2));
          await browser.close();
          JS
          node sample-visual-qa/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-studio-polished-sample
          path: sample-visual-qa/
          retention-days: 7
