name: Everyday PDF workflow verification
on:
  push:
    branches: [fix/everyday-pdf-workflows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: everyday-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export reproducible review workspace
        run: |
          git archive --format=tar HEAD > /tmp/pdf-review-source.tar
          tar -cf /tmp/pdf-review-dependencies.tar node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-review-workspace
          path: /tmp/pdf-review-*.tar
          retention-days: 2
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Everyday workflow browser tests
        shell: bash
        run: |
          if [ -f tests/e2e/everyday-workflows.spec.ts ]; then
            npx playwright install --with-deps chromium
            npx playwright test tests/e2e/everyday-workflows.spec.ts --project=chromium
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-pdf-test-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
