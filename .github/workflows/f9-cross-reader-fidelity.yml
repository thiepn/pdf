name: F9 independently validated PDF exports

on:
  pull_request:
    paths:
      - "tests/e2e/f9-export-roundtrip.spec.ts"
      - "scripts/f9/**"
      - ".github/workflows/f9-cross-reader-fidelity.yml"
      - "src/**"
      - "docs/f9/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install independently developed PDF readers
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends qpdf poppler-utils
          python -m pip install --requirement requirements-phase11.txt
      - name: Install locked JS packages
        run: npm ci --no-audit --no-fund
      - name: Generate real-world compatibility cases
        run: python scripts/p8/generate_compatibility_corpus.py
      - name: Check F9 fail-closed validator tests
        run: python -m unittest discover -s scripts/f9 -p "test_*.py" -v
      - name: Typecheck and run preservation regressions
        run: |
          npm run typecheck
          npx vitest run tests/unit/pdfFidelity.test.ts tests/unit/preservationFingerprint.test.ts tests/unit/pagePreservation.test.ts
      - name: Build verified app
        run: npm run build:verified
        env:
          VITE_BASE_PATH: /pdf/
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Export actual edited PDFs through Chromium UI
        run: |
          mkdir -p artifacts/f9-exports
          npx playwright test tests/e2e/f9-export-roundtrip.spec.ts --project=chromium --workers=1 --retries=0
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: /pdf/
      - name: Require qpdf and Poppler round-trip consistency
        run: python scripts/f9/validate_export_roundtrip.py --export-dir artifacts/f9-exports --report docs/f9/cross-reader-report.json
      - name: Upload independent-reader evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f9-independent-reader-evidence
          path: |
            docs/f9/cross-reader-report.json
            artifacts/f9-exports
            playwright-report
          if-no-files-found: ignore
