name: Promote qualified v7.1.1 stable release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-v7-1-1-stable.yml

permissions:
  contents: write
  pages: write
  id-token: write

env:
  RELEASE_TAG: v7.1.1
  RELEASE_COMMIT: 2e43f928adb77538f27f1f257f6ba5b6e76f4341
  NODE_VERSION: 22.16.0
  NPM_VERSION: 10.9.2
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
  VITE_RELEASE_CHANNEL: stable
  R8_EXTERNAL_CORPUS: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Verify immutable release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "${RELEASE_COMMIT}" refs/remotes/origin/main
          node -e "const p=require('./package.json'); if(p.version!=='7.1.1') process.exit(1)"
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Unicode corpus font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core
      - name: Pin npm toolchain
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
      - name: Resolve deterministic build metadata
        run: echo "BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Install external-reader validation tools
        run: python -m pip install --requirement requirements-phase11.txt
      - name: Audit lockfile and install exact graph
        run: |
          npm run audit:lockfile
          npm run audit:toolchain
          npm ci --no-audit --no-fund
          npm run audit:tree
      - name: Generate and validate all release browser corpora
        run: node scripts/releases/prepare-browser-corpora.mjs
      - name: Run P9 release-candidate freeze audit
        run: npm run audit:p9:release-candidate
      - name: Run frozen v7 web release gate
        run: npm run release:web
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          VITE_RELEASE_CHANNEL: stable
      - name: Fingerprint first stable distribution
        run: node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-first.sha256
      - name: Rebuild and prove reproducibility
        run: |
          rm -rf dist
          npm run build:verified
          node scripts/phase27/dist-fingerprint.mjs dist > /tmp/dist-second.sha256
          diff -u /tmp/dist-first.sha256 /tmp/dist-second.sha256
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          VITE_RELEASE_CHANNEL: stable
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser-qualify exact stable artifact
        run: npm run test:e2e -- --workers=2 --retries=0
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          PLAYWRIGHT_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
          VITE_RELEASE_CHANNEL: stable
      - name: Verify stable build metadata
        run: |
          grep -q '"version": "7.1.1"' dist/release-metadata.json
          grep -q '"channel": "stable"' dist/release-metadata.json
      - name: Dependency security gate
        run: npm run audit:security
      - name: Create release archives
        run: |
          mkdir -p release-assets
          git archive --format=zip --output="release-assets/pdf-studio-v7.1.1-source.zip" HEAD
          git archive --format=tar.gz --output="release-assets/pdf-studio-v7.1.1-source.tar.gz" HEAD
          (cd dist && zip -qr "../release-assets/pdf-studio-v7.1.1-dist.zip" .)
          cp docs/phase-11/corpus-validation-report.json "release-assets/pdf-studio-v7.1.1-corpus-validation.json"
          cp docs/phase-28/adversarial-corpus-report.json "release-assets/pdf-studio-v7.1.1-adversarial-corpus-validation.json"
          cp docs/p8/compatibility-corpus-report.json "release-assets/pdf-studio-v7.1.1-compatibility-corpus-validation.json"
          cp docs/P9_RELEASE_CANDIDATE.md "release-assets/pdf-studio-v7.1.1-qualification.md"
          (cd release-assets && sha256sum pdf-studio-* > pdf-studio-v7.1.1.sha256)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: v7.1.1-release-assets
          path: release-assets

  tag-stable:
    runs-on: ubuntu-latest
    needs: qualify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create immutable annotated stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)" = "${RELEASE_COMMIT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "PDF Studio ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  deploy-stable:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: tag-stable
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact browser-qualified stable artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-stable:
    runs-on: ubuntu-latest
    needs: deploy-stable
    timeout-minutes: 10
    steps:
      - name: Verify deployed stable application
        env:
          PAGE_URL: ${{ needs.deploy-stable.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl --fail --location --retry 8 --retry-delay 5 "${base}"
          curl --fail --location --retry 8 --retry-delay 5 "${base}manifest.webmanifest" | grep -F 'PDF Studio' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}sw.js" | grep -F '7.1.1' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F '"channel": "stable"' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F '"version": "7.1.1"' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-integrity.json" | grep -F 'fileCount' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}offline-assets.json" | grep -F 'release-metadata.json' > /dev/null

  publish:
    runs-on: ubuntu-latest
    needs: smoke-stable
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: v7.1.1-release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.1.1
          target_commitish: ${{ env.RELEASE_COMMIT }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
