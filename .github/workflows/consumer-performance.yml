name: Consumer performance budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumer-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        env:
          VITE_BUILD_TIMESTAMP: 2026-08-19T00:00:00.000Z
        run: npm run build

      - name: Enforce consumer bundle boundary
        env:
          LPS_CORE_JS_GZIP_BUDGET_KB: "800"
          LPS_CORE_TOTAL_GZIP_BUDGET_KB: "1600"
        run: node scripts/audit-consumer-performance.mjs
