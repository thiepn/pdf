name: P41 apply patch

on:
  push:
    branches:
      - ux/p41-product-wide-consumer-language

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply P41 language and disclosure changes
        shell: bash
        run: |
          if [ -f docs/reconstruction/p41-product-wide-consumer-language.md ]; then
            echo "P41 patch already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def r(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Route and task catalog.
          r("src/App.tsx", 'case "diagnostics": return { title: "Troubleshooting diagnostics", subtitle: "Advanced browser capability checks and local technical error records." };', 'case "diagnostics": return { title: "Troubleshooting", subtitle: "Check browser readiness, performance, and local error records. Technical labs are available in details." };')
          r("src/App.tsx", 'case "secure": return { title: "Protect PDF", subtitle: "Fill forms, permanently apply redactions, sanitize active content, flatten supported structures, or add password protection." };', 'case "secure": return { title: "Protect PDF", subtitle: "Fill forms, permanently apply redactions, remove risky content, make supported content permanent, or add password protection." };')
          r("src/App.tsx", 'case "compliance": return { title: "Accessibility", subtitle: "Check accessibility findings and supported standards-related document details." };', 'case "compliance": return { title: "Accessibility", subtitle: "Check accessibility, apply supported fixes, and open standards details when needed." };')
          r("src/ia/taskCatalog.ts", '{ id: "protect", label: "Protect & sign", description: "Fill forms, redact permanently, sanitize, or password-protect a PDF." },', '{ id: "protect", label: "Protect & sign", description: "Fill forms, redact permanently, remove risky content, or password-protect a PDF." },')
          r("src/ia/taskCatalog.ts", '{ id: "sanitize-pdf", label: "Sanitize PDF", description: "Remove risky active content and create a safer derived copy.", keywords: "sanitize javascript actions attachments active content security clean", category: "protect", audience: "everyday", icon: "secure", target: { kind: "workspace", mode: "secure" } },', '{ id: "sanitize-pdf", label: "Clean up PDF", description: "Remove risky scripts, automatic actions, embedded files, and other active content.", keywords: "sanitize javascript actions attachments active content security clean", category: "protect", audience: "everyday", icon: "secure", target: { kind: "workspace", mode: "secure" } },')
          r("src/ia/taskCatalog.ts", '{ id: "compress-pdf", label: "Compress PDF", description: "Use lossless optimization or stronger image-based compression.", keywords: "compress optimize reduce file size smaller lossless raster", category: "convert", audience: "everyday", icon: "compress", target: { kind: "workspace", mode: "compress" } },', '{ id: "compress-pdf", label: "Compress PDF", description: "Reduce file size while choosing whether to preserve text and forms or use stronger image-based compression.", keywords: "compress optimize reduce file size smaller lossless raster", category: "convert", audience: "everyday", icon: "compress", target: { kind: "workspace", mode: "compress" } },')
          r("src/ia/taskCatalog.ts", '{ id: "grayscale-pdf", label: "Create grayscale PDF", description: "Create a grayscale raster copy when appearance matters more than interactive PDF structure.", keywords: "black white monochrome grayscale raster", category: "convert", audience: "advanced", icon: "toolbox", target: { kind: "workspace", mode: "toolbox" } },', '{ id: "grayscale-pdf", label: "Create grayscale PDF", description: "Create a grayscale image-based copy when appearance matters more than searchable or interactive content.", keywords: "black white monochrome grayscale raster", category: "convert", audience: "advanced", icon: "toolbox", target: { kind: "workspace", mode: "toolbox" } },')
          r("src/ia/taskCatalog.ts", '{ id: "accessibility-check", label: "Check accessibility", description: "Review accessibility findings and supported remediation tools.", keywords: "accessibility tags reading order alt text wcag pdf ua", category: "review", audience: "advanced", icon: "compliance", target: { kind: "workspace", mode: "compliance" } },', '{ id: "accessibility-check", label: "Check accessibility", description: "Review accessibility findings and supported fixes.", keywords: "accessibility tags reading order alt text wcag pdf ua", category: "review", audience: "advanced", icon: "compliance", target: { kind: "workspace", mode: "compliance" } },')

          # Compression.
          for old, new in [
              ('onTitleChange?.(`Compress · ${manifest.name}`, `${pdf.numPages} pages · Local structural or raster compression.`);', 'onTitleChange?.(`Compress · ${manifest.name}`, `${pdf.numPages} pages · Choose structure-preserving or stronger image-based compression.`);'),
              ('setError("Enter the PDF password. It remains in memory only.");', 'setError("Enter the PDF password. It is used only in this tab and is not saved.");'),
              ('update({ detail: profile === "lossless" ? "Optimizing PDF structure…" : "Rasterizing pages…", progress: 0.02 });', 'update({ detail: profile === "lossless" ? "Reducing file size without converting pages to images…" : "Converting pages to images for stronger compression…", progress: 0.02 });'),
              ('setStatus(`Rasterizing page ${completed} of ${total}…`); update({ detail: `Rasterizing page ${completed} of ${total}…`, progress: Math.min(0.85, value * 0.85) });', 'setStatus(`Compressing page ${completed} of ${total}…`); update({ detail: `Compressing page ${completed} of ${total}…`, progress: Math.min(0.85, value * 0.85) });'),
              ('"Raster compression converts pages to images. Searchable text, forms, links, annotations, signatures, and vector quality are not preserved."', '"Strong compression converts each page to an image. Search, forms, links, annotations, signatures, and sharp vector graphics are no longer preserved as interactive PDF content."'),
              ('"Raster output contains only new basic metadata."', '"Image-based output contains only new basic document information."'),
              ('update({ stage: "validating", detail: "Reopening compressed output…", progress: 0.9 });', 'update({ stage: "validating", detail: "Checking compressed PDF…", progress: 0.9 });'),
              ('throw new Error("Compression validation failed: page count changed.");', 'throw new Error("The compressed PDF could not be verified because its page count changed.");'),
              ('setStatus("Compressed output validated")', 'setStatus("Compressed PDF checked and ready")'),
              ('{ label: "Saving compressed revision", cancellable: false, reserveBytes: project.byteLength }', '{ label: "Saving compressed PDF", cancellable: false, reserveBytes: project.byteLength }'),
              ('update({ stage: "committing", detail: "Validating storage and writing a new revision…", progress: 0.4 });', 'update({ stage: "committing", detail: "Checking local storage and saving as a new project…", progress: 0.4 });'),
              ('<p className="eyebrow">Compression</p><h2>Optimize or raster-compress</h2><p>Lossless mode cleans PDF structure. Raster profiles trade editability and searchability for stronger size reduction.</p>', '<p className="eyebrow">Compression</p><h2>Choose how much to shrink the PDF</h2><p>Keep text and forms for a safer reduction, or use image-based compression for a smaller file with fewer interactive features.</p>'),
              ('<strong>Lossless optimization</strong><small>Clean revisions and compress streams without rasterizing pages.</small>', '<strong>Keep text and forms</strong><small>Reduce file size without turning pages into images.</small>'),
              ('{processing ? "Processing…" : "Optimize PDF"}', '{processing ? "Processing…" : "Compress PDF"}'),
              ('<strong>Output reopened and validated</strong>', '<strong>Compressed PDF checked and ready</strong>')
          ]:
              r("src/views/CompressionPage.tsx", old, new)

          # OCR.
          for old, new in [
              ('setStatus("Recovered an unfinished OCR job.");', 'setStatus("Resumed an unfinished OCR session.");'),
              ('setError("Enter the PDF password. It is held only in memory.");', 'setError("Enter the PDF password. It is used only in this tab and is not saved.");'),
              ('setStatus("OCR settings changed · previous cached pages were invalidated.");', 'setStatus("OCR settings changed · previous saved page results were cleared.");'),
              ('throw new Error("OCR job could not be initialized.");', 'throw new Error("OCR could not start.");'),
              ('update({ detail: `Rendering page ${pageNumber}…`, progress: Math.min(0.78, (pageIndex / parsedPages.pageArray.length) * 0.78) });\n        setStatus(`Rendering page ${pageNumber}…`);', 'update({ detail: `Preparing page ${pageNumber}…`, progress: Math.min(0.78, (pageIndex / parsedPages.pageArray.length) * 0.78) });\n        setStatus(`Preparing page ${pageNumber}…`);'),
              ('throw new Error("This Tesseract build did not return searchable PDF output.");', 'throw new Error("OCR could not create searchable output for this page.");'),
              ('setStatus("Merging searchable pages…");', 'setStatus("Combining searchable pages…");'),
              ('update({ detail: "Merging searchable OCR pages…", progress: 0.86 });', 'update({ detail: "Combining searchable pages…", progress: 0.86 });'),
              ('update({ stage: "validating", detail: "Validating searchable PDF…", progress: 0.93 });', 'update({ stage: "validating", detail: "Checking searchable PDF…", progress: 0.93 });'),
              ('throw new Error("OCR output validation failed: page count mismatch.");', 'throw new Error("The searchable PDF could not be verified because its page count changed.");'),
              ('throw new Error("OCR output validation failed: no searchable text was extracted from a recognized page.");', 'throw new Error("The searchable PDF could not be verified because recognized text was missing from the saved page.");'),
              ('update({ stage: "committing", detail: "Validating storage and saving OCR revision…", progress: 0.4 });', 'update({ stage: "committing", detail: "Checking local storage and saving as a new project…", progress: 0.4 });'),
              ('<section><p className="eyebrow">Local OCR</p><h2>Make scans searchable</h2><p>Pages are rendered and recognized locally. Completed page results are stored so interrupted jobs can resume.</p></section>', '<section><p className="eyebrow">Local OCR</p><h2>Make scans searchable</h2><p>Recognition happens on this device. Completed pages are saved locally so you can resume after an interruption.</p></section>'),
              ('>Discard job</button>', '>Discard progress</button>'),
              ('<div><span>Confidence {Math.round(result.confidence)}%</span><span>{result.words.length} words</span></div><p>{result.error ?? (result.text.slice(0, 240) || "No text recognized.")}</p>', '<div><span>{result.words.length} words</span></div><details><summary>Recognition details</summary><small>Confidence {Math.round(result.confidence)}%</small></details><p>{result.error ?? (result.text.slice(0, 240) || "No text recognized.")}</p>'),
              ('<strong>Searchable output validated</strong>', '<strong>Searchable PDF checked and ready</strong>')
          ]:
              r("src/views/OcrPage.tsx", old, new)

          # Protect / Forms.
          for old, new in [
              ('{ id: "overview", label: "Inspector", icon: "◇" },', '{ id: "overview", label: "Overview", icon: "◇" },'),
              ('{ id: "sanitize", label: "Sanitize", icon: "⌁" },', '{ id: "sanitize", label: "Clean up", icon: "⌁" },'),
              ('useState("Opening secure workspace…")', 'useState("Opening protection tools…")'),
              ('setStatus("Inspecting PDF security…");', 'setStatus("Checking PDF protection…");'),
              ('`${report.pageCount} pages · ${report.formFields.length} fields · ${report.signatures.length} signature fields · local processing`', '`${report.pageCount} pages · ${report.formFields.length} form fields · ${report.signatures.length} digital signature fields`'),
              ('setError("Enter the PDF password. It remains only in memory for this local session.");', 'setError("Enter the PDF password. It is used only in this tab and is not saved.");'),
              ('setStatus("Compiling editor and security changes…");', 'setStatus("Preparing protected PDF…");'),
              ('update({ detail: "Compiling editor and security changes…", progress: 0.05 });', 'update({ detail: "Preparing protected PDF…", progress: 0.05 });'),
              ('setStatus("Applying forms, redactions, sanitization, and protection…");', 'setStatus("Applying forms, redactions, cleanup, and password settings…");'),
              ('update({ detail: "Applying forms, redactions, sanitization, and protection…", progress: 0.45 });', 'update({ detail: "Applying forms, redactions, cleanup, and password settings…", progress: 0.45 });'),
              ('setStatus("Running security-critical validation…");', 'setStatus("Checking protected PDF…");'),
              ('update({ stage: "validating", detail: "Running security-critical validation…", progress: 0.82 });', 'update({ stage: "validating", detail: "Checking protected PDF before saving…", progress: 0.82 });'),
              ('throw new Error(`Security validation failed: ${result.checks.filter((check) => !check.passed).map((check) => check.name).join(", ")}. The output was not released.`);', 'throw new Error(`The protected PDF did not pass the final safety check: ${result.checks.filter((check) => !check.passed).map((check) => check.name).join(", ")}. No output was created.`);'),
              ('update({ stage: "committing", detail: "Saving a new protected revision…", progress: 0.94 });', 'update({ stage: "committing", detail: "Saving protected PDF as a new project…", progress: 0.94 });'),
              ('setStatus(`Validated and downloaded · ${formatBytes(secured.report.outputBytes)}`);', 'setStatus(`Protected PDF downloaded · ${formatBytes(secured.report.outputBytes)}`);'),
              ('<span>{status} · security-critical changes create a new output</span>', '<span>{status} · your original PDF is kept unchanged</span>'),
              ('>Download secured PDF</button>', '>Download protected PDF</button>'),
              ('<strong>Forms & Protect blocked</strong>', '<strong>Protection action blocked</strong>'),
              ('PanelTitle title="Security inspector" subtitle="Current document state before export"', 'PanelTitle title="Protection overview" subtitle="Current document state before you create a protected copy"'),
              ('<Fact label="Revisions" value={String(inspection.versionCount)} />', '<Fact label="Saved PDF versions" value={String(inspection.versionCount)} />'),
              ('Only Apply redactions removes the underlying text, images, and vector content. The output is then rewritten with garbage collection.', 'Only Apply redactions removes the underlying text, images, and shapes. PDF Studio then rewrites the output so removed content is not retained.'),
              ('<span>Vector line art</span>', '<span>Lines and shapes</span>'),
              ('<PanelTitle title="Forms" subtitle="Fill existing AcroForm fields" /><div className="security-empty"><strong>No AcroForm fields detected</strong><p>The current MuPDF browser API reliably edits existing widgets but does not yet provide production-ready creation of arbitrary new field types. Form creation remains deferred rather than simulated.</p>', '<PanelTitle title="Forms" subtitle="Fill existing PDF form fields" /><div className="security-empty"><strong>No fillable form fields detected</strong><p>PDF Studio can edit supported fields that already exist in a PDF. Creating new form fields is not supported yet.</p>'),
              ('subtitle={`${fields.length} existing fields · JavaScript execution disabled`}', 'subtitle={`${fields.length} existing fields · PDF scripts are not run`}'),
              ('Read-only and cryptographic signature fields are displayed but cannot be changed here.', 'Read-only and digital signature fields are displayed but cannot be changed here.'),
              ('PanelTitle title="Signatures" subtitle="Visual marks and existing cryptographic fields"', 'PanelTitle title="Signatures" subtitle="Visual signature marks and existing digital signature fields"'),
              ('<h3>Cryptographic fields ({context.inspection.signatures.length})</h3>', '<h3>Digital signature fields ({context.inspection.signatures.length})</h3>'),
              ('No cryptographic signature fields were detected.', 'No digital signature fields were detected.'),
              ('Certificate-based signing is not enabled because the browser MuPDF API does not expose the required signer workflow reliably. The application does not substitute an image and call it a digital signature.', 'Certificate-based signing is not available in the browser build yet. PDF Studio does not substitute an image and call it a digital signature.'),
              ('{ key: "removeJavaScript", label: "Remove JavaScript name trees", detail: inspection.hasJavaScript ? "Active content detected" : "No JavaScript detected" },', '{ key: "removeJavaScript", label: "Remove embedded scripts", detail: inspection.hasJavaScript ? "Active scripts detected" : "No scripts detected" },'),
              ('{ key: "removeAttachments", label: "Remove embedded attachments", detail: `${inspection.attachmentCount} catalog attachments detected` },', '{ key: "removeAttachments", label: "Remove embedded files", detail: `${inspection.attachmentCount} embedded file${inspection.attachmentCount === 1 ? "" : "s"} detected` },'),
              ('{ key: "collapseRevisionHistory", label: "Collapse incremental history", detail: `${inspection.versionCount} stored version${inspection.versionCount === 1 ? "" : "s"}` }', '{ key: "collapseRevisionHistory", label: "Remove previous saved PDF versions", detail: `${inspection.versionCount} stored version${inspection.versionCount === 1 ? "" : "s"}` }'),
              ('PanelTitle title="Sanitize document" subtitle="Remove private, active, or collaborative content"', 'PanelTitle title="Clean up document" subtitle="Remove private, active, or collaborative content"'),
              ('PanelTitle title="Encryption and permissions" subtitle="Passwords are never written to local project storage"', 'PanelTitle title="Passwords and permissions" subtitle="Passwords are used for this operation and are not saved"'),
              ('<span>Output security</span>', '<span>Password protection</span>'),
              ('<option value="keep">Keep source encryption state</option><option value="remove">Remove encryption</option><option value="aes-256">Protect with AES-256</option>', '<option value="keep">Keep current password protection</option><option value="remove">Remove password protection</option><option value="aes-256">Protect with a password (AES-256)</option>'),
              ('<strong>Permission flags are not DRM.</strong><p>They communicate intended restrictions to compatible PDF readers. The open password provides the actual encryption barrier.</p>', '<strong>PDF permissions depend on the reader.</strong><p>They tell compatible PDF readers which actions should be allowed. The open password is the actual encryption barrier.</p>'),
              ('<p id="secure-password-description">The password remains in memory and is passed only to local PDF engines.</p>', '<p id="secure-password-description">Your password is used only in this tab to open and protect the PDF. It is not saved.</p>'),
              ('>Open secure workspace</button>', '>Open protection tools</button>'),
              ('<PanelTitle title="Validation" subtitle="Output is withheld when a required check fails" />', '<PanelTitle title="Final check" subtitle="PDF Studio does not release output when a required safety check fails" />'),
              ('<div className="security-check-list">', '<details><summary>Check details</summary><div className="security-check-list">'),
              ('</div></> : <div className="security-empty"><strong>No output validated yet</strong><p>Export runs PDF.js and MuPDF reopening, structure checks, sanitization inspection, encryption checks, and text-extraction checks for marked redactions.</p></div>}', '</div></details></> : <div className="security-empty"><strong>No protected output checked yet</strong><p>When you export, PDF Studio reopens the result and checks its structure, protection settings, removed content, and redactions before download.</p></div>}')
          ]:
              r("src/views/SecurePage.tsx", old, new)

          # Accessibility / standards.
          for old, new in [
              ('const [tab, setTab] = useState<Tab>("preflight");', 'const [tab, setTab] = useState<Tab>("accessibility");'),
              ('setError("Enter the PDF password. It remains in memory only and is never persisted.");', 'setError("Enter the PDF password. It is used only in this tab and is not saved.");'),
              ('update({ stage: "validating", detail: "Reopening and verifying compliance structures…", progress: 0.9 });', 'update({ stage: "validating", detail: "Checking the standards-ready PDF…", progress: 0.9 });'),
              ('{ label: "Saving compliance revision", cancellable: false, reserveBytes: project.byteLength }', '{ label: "Saving standards-ready PDF", cancellable: false, reserveBytes: project.byteLength }'),
              ('update({ stage: "committing", detail: "Validating storage and saving a new revision…", progress: 0.4 });', 'update({ stage: "committing", detail: "Checking local storage and saving as a new project…", progress: 0.4 });'),
              ('<p>Check accessibility, archive readiness, signatures, print preparation, and security. Technical PDF terms are kept in expandable details where possible.</p>', '<p>Start with accessibility and supported fixes. Archive, signature, print, security, and technical standards details remain available when you need them.</p>'),
              ('<strong>Standards operation failed</strong>', '<strong>Could not create standards-ready copy</strong>'),
              ('<span>The password stays in memory for this workspace session only.</span>', '<span>The password is used only in this tab and is not saved.</span>'),
              ('label="PDF revisions"', 'label="Saved PDF versions"')
          ]:
              r("src/views/CompliancePage.tsx", old, new)

          # Batch.
          for old, new in [
              ('{type:"optimize",label:"Lossless optimize"}', '{type:"optimize",label:"Compress without page images"}'),
              ('{type:"raster-compress",label:"Raster compress"}', '{type:"raster-compress",label:"Stronger image compression"}'),
              ('<p>Choose actions in order, add several PDFs, and run the same workflow on all of them. Split and Page images can produce ZIP output and must remain last.</p>', '<p>Choose actions in order, add several PDFs, and run the same workflow on all of them. If you split PDFs or export page images, that action must be last because it creates multiple files.</p>'),
              ('<aside className="batch-recipe"><h3>Recipe</h3>', '<aside className="batch-recipe"><h3>Workflow</h3>'),
              ('>Save recipe</button>', '>Save workflow</button>'),
              ('>Export JSON</button>', '>Export workflow</button>'),
              ('>Import JSON</button>', '>Import workflow</button>'),
              ('>Saved recipes<select', '>Saved workflows<select'),
              ('<strong>No queued PDFs</strong><p>Add files, build a recipe, then run the queue.</p>', '<strong>No PDFs added yet</strong><p>Add files, choose your workflow, then start processing.</p>'),
              ('{paused?"Resume queue":"Run queue"}', '{paused?"Resume":"Run workflow"}'),
              ('>End paused run</button>', '>Stop</button>'),
              ('<small>Rasterizes pages and removes interactive PDF structure.</small>', '<small>Converts pages to images, so searchable and interactive PDF features are removed.</small>')
          ]:
              r("src/views/BatchPage.tsx", old, new)

          # Diagnostics navigation: keep engineering labs, but disclose them explicitly.
          old_labs = 'const labs = [\n  { id: "system", label: "System" },\n  { id: "performance", label: "Performance" },\n  { id: "overview", label: "Engineering overview" },\n  { id: "deployment", label: "Deployment" },\n  { id: "viewer", label: "PDF.js" },\n  { id: "engine", label: "MuPDF" },\n  { id: "coordinates", label: "Coordinates" },\n  { id: "storage", label: "Storage probe" }\n] as const;'
          new_labs = 'const primaryLabs = [\n  { id: "system", label: "System" },\n  { id: "performance", label: "Performance" }\n] as const;\nconst technicalLabs = [\n  { id: "overview", label: "Technical overview" },\n  { id: "deployment", label: "Deployment" },\n  { id: "viewer", label: "PDF.js" },\n  { id: "engine", label: "MuPDF" },\n  { id: "coordinates", label: "Coordinates" },\n  { id: "storage", label: "Storage probe" }\n] as const;\nconst labs = [...primaryLabs, ...technicalLabs];'
          r("src/views/DiagnosticsPage.tsx", old_labs, new_labs)
          r("src/views/DiagnosticsPage.tsx", 'export function DiagnosticsPage({ lab = "system" }: { lab?: string }) {\n  return <div className="stack">\n    <nav className="diagnostic-tabs" aria-label="System diagnostics and engineering laboratories">{labs.map((item) => <a className={lab === item.id ? "active" : ""} href={routeHref({ name: "diagnostics", lab: item.id })} key={item.id}>{item.label}</a>)}</nav>', 'export function DiagnosticsPage({ lab = "system" }: { lab?: string }) {\n  const activeLab = labs.some((item) => item.id === lab) ? lab : "system";\n  const technicalActive = technicalLabs.some((item) => item.id === activeLab);\n  return <div className="stack">\n    <nav className="diagnostic-tabs" aria-label="Troubleshooting diagnostics">{primaryLabs.map((item) => <a className={activeLab === item.id ? "active" : ""} href={routeHref({ name: "diagnostics", lab: item.id })} key={item.id}>{item.label}</a>)}</nav>\n    <details className="card diagnostic-technical-disclosure" open={technicalActive}><summary>Technical diagnostics</summary><p>Implementation-specific checks for deeper troubleshooting. Most users do not need these.</p><nav className="diagnostic-tabs" aria-label="Technical diagnostic laboratories">{technicalLabs.map((item) => <a className={activeLab === item.id ? "active" : ""} href={routeHref({ name: "diagnostics", lab: item.id })} key={item.id}>{item.label}</a>)}</nav></details>')
          for old, new in [
              ('{lab === "system" ? <SystemDiagnostics /> : null}', '{activeLab === "system" ? <SystemDiagnostics /> : null}'),
              ('{lab === "performance" ? <PerformanceDiagnostics /> : null}', '{activeLab === "performance" ? <PerformanceDiagnostics /> : null}'),
              ('{lab === "deployment" ? <DeploymentLab /> : null}', '{activeLab === "deployment" ? <DeploymentLab /> : null}'),
              ('{lab === "viewer" ? <PdfViewerLab /> : null}', '{activeLab === "viewer" ? <PdfViewerLab /> : null}'),
              ('{lab === "engine" ? <EngineLab /> : null}', '{activeLab === "engine" ? <EngineLab /> : null}'),
              ('{lab === "coordinates" ? <CoordinatesLab /> : null}', '{activeLab === "coordinates" ? <CoordinatesLab /> : null}'),
              ('{lab === "storage" ? <StorageLab /> : null}', '{activeLab === "storage" ? <StorageLab /> : null}'),
              ('{!labs.some((item) => item.id === lab) || lab === "overview" ? <Overview /> : null}', '{activeLab === "overview" ? <Overview /> : null}')
          ]:
              r("src/views/DiagnosticsPage.tsx", old, new)

          # System diagnostics: keep raw browser details behind disclosure.
          for old, new in [
              ('{ name: "WebAssembly", supported: typeof WebAssembly !== "undefined", detail: "Required by MuPDF and OCR." }', '{ name: "WebAssembly", supported: typeof WebAssembly !== "undefined", detail: "Required for local PDF and OCR processing." }'),
              ('{ name: "Web Workers", supported: typeof Worker !== "undefined", detail: "Keeps intensive document processing off the interface thread." }', '{ name: "Web Workers", supported: typeof Worker !== "undefined", detail: "Keeps intensive document processing away from the interface." }'),
              ('{ name: "Storage persistence", supported: Boolean(navigator.storage?.persist), detail: "Reduces automatic eviction risk." }', '{ name: "Storage persistence", supported: Boolean(navigator.storage?.persist), detail: "Reduces the chance that the browser automatically clears local projects." }'),
              ('{ name: "Web Locks", supported: Boolean(navigator.locks?.request), detail: "Used to serialize document operations across browser contexts when available." }', '{ name: "Web Locks", supported: Boolean(navigator.locks?.request), detail: "Helps prevent two browser contexts from changing the same document at once." }'),
              ('<div><p className="eyebrow">Release</p><h2>{release.name} {release.version}</h2><p>{release.channel} · {navigator.onLine ? "online" : "offline"}</p></div>', '<div><p className="eyebrow">App status</p><h2>{release.name} {release.version}</h2><p>{navigator.onLine ? "Online" : "Offline"} · {records.length ? `${records.length} local error record${records.length === 1 ? "" : "s"}` : "No recorded errors"}</p></div>'),
              ('<section className="capability-grid">', '<details className="card"><summary>Technical browser details</summary><p>Browser APIs, device signals, storage limits, and desktop-bridge information used for deeper troubleshooting.</p><section className="capability-grid">'),
              ('</section> : null}\n    <section className="release-section">', '</section> : null}</details>\n    <section className="release-section">'),
              ('<p className="eyebrow">Local error log</p><h2>Recoverable diagnostic records</h2>', '<p className="eyebrow">Local error log</p><h2>Recent application errors</h2>'),
              ('<small>Diagnostic ID: {record.id} · No PDF bytes or passwords stored; technical messages are sanitized before retention.</small>', '<small>Diagnostic ID: {record.id} · No PDF bytes or passwords are stored with this record.</small>'),
