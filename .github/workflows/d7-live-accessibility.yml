name: D7 real accessibility interaction

on:
  pull_request:
    paths:
      - src/views/EditorPage.tsx
      - src/interaction/d7/D7KeyboardHelp.tsx
      - src/product/studio-polish-d7-live.css
      - src/product/product.css
      - tests/e2e/d7-live-keyboard-help.spec.ts
      - .github/workflows/d7-live-accessibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d7-live-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focus-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify live modal focus and shortcut safety
        run: npx playwright test tests/e2e/d7-live-keyboard-help.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - name: Capture accessibility screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d7-live-a11y-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
