name: Deploy qualified v7.0.0 stable from main context

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stable-promotion-bridge.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  RELEASE_COMMIT: cc630810c290e4b081fbec01e7e21b04893d9dba
  QUALIFICATION_RUN: "33244734535"

concurrency:
  group: pages-stable
  cancel-in-progress: false

jobs:
  prepare-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify one-shot stable provenance
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          if git ls-remote --exit-code --tags origin "refs/tags/v7.0.0" >/dev/null 2>&1; then
            echo "::error::Stable tag v7.0.0 already exists; refusing to publish again."
            exit 1
          fi
      - name: Wait for same-push candidate Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_run=""
          for attempt in $(seq 1 40); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20")"
            candidate_run="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n 1)"
            if [ -n "$candidate_run" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$candidate_run" ]; then
            echo "::error::Could not resolve the candidate Pages run for $GITHUB_SHA."
            exit 1
          fi
          echo "Waiting for candidate Pages run $candidate_run to finish before stable deployment."
          for attempt in $(seq 1 100); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}" --jq '.status')"
            if [ "$state" = "completed" ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run}" --jq '.conclusion')"
              if [ "$conclusion" != "success" ]; then
                echo "::error::Candidate Pages run $candidate_run concluded $conclusion; stable deployment remains blocked."
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for candidate Pages run $candidate_run."
          exit 1
      - name: Download exact qualified v7 release assets
        uses: actions/download-artifact@v8
        with:
          name: v7.0.0-release-assets
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFICATION_RUN }}
          github-token: ${{ github.token }}
      - name: Verify and stage exact stable distribution
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check pdf-studio-v7.0.0.sha256)
          rm -rf dist
          mkdir -p dist
          unzip -q release-assets/pdf-studio-v7.0.0-dist.zip -d dist
          grep -q '"version": "7.0.0"' dist/release-metadata.json
          grep -q '"channel": "stable"' dist/release-metadata.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-v7.0.0-release-assets
          path: release-assets

  deploy-stable:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepare-stable
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact qualified stable artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-stable:
    runs-on: ubuntu-latest
    needs: deploy-stable
    timeout-minutes: 10
    steps:
      - name: Verify deployed stable application
        env:
          PAGE_URL: ${{ needs.deploy-stable.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl --fail --location --retry 8 --retry-delay 5 "${base}"
          curl --fail --location --retry 8 --retry-delay 5 "${base}manifest.webmanifest" | grep -F 'PDF Studio' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}sw.js" | grep -F '7.0.0' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F '"channel": "stable"' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-metadata.json" | grep -F '"version": "7.0.0"' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}release-integrity.json" | grep -F 'fileCount' > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 "${base}offline-assets.json" | grep -F 'release-metadata.json' > /dev/null

  publish:
    runs-on: ubuntu-latest
    needs: smoke-stable
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qualified-v7.0.0-release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: PDF Studio v7.0.0
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
