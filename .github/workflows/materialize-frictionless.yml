name: Apply and verify frictionless workflows
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/materialize-frictionless.yml]
permissions:
  contents: read
jobs:
  implement:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = sorted(Path('.github/review-patch').glob('*.xz.b64'))
          assert [p.name for p in parts] == ['01.xz.b64', '02.xz.b64', '03.xz.b64', '04.xz.b64']
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6536dfa631b3c148267d02d030c606c487118a40968f0dd7ae70376b6c2221ad'
          Path('/tmp/frictionless.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/frictionless.patch
          git apply --unidiff-zero --index /tmp/frictionless.patch
          git rm .github/review-patch/*.xz.b64 .github/workflows/review-runtime.yml .github/workflows/materialize-frictionless.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: visual assembly, crop, batch jobs and edit-preserving task workflows'
          test "$(git ls-remote origin refs/heads/redesign/task-first-experience | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/redesign/task-first-experience
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture exact committed source
        run: |
          git archive --format=tar.gz HEAD > /tmp/pdf-frictionless-source.tar.gz
          git rev-parse HEAD > /tmp/pdf-frictionless-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-frictionless-source
          path: |
            /tmp/pdf-frictionless-source.tar.gz
            /tmp/pdf-frictionless-sha.txt
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/source-audit.mjs
      - run: node scripts/releases/v6.1.0/runtime-regression.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify actual task workflows in three browser engines
        run: npx playwright test tests/e2e/task-first- tests/e2e/everyday-workflows.spec.mjs --project=chromium --project=firefox --project=webkit --workers=2 --retries=0 --max-failures=8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-frictionless-browser-evidence
          path: |
            playwright-report/
            test-results/
            source-audit-report.json
          retention-days: 7
