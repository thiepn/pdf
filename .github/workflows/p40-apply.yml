name: P40 branch patch

on:
  push:
    branches:
      - ux/p40-editor-secondary-language

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p40-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply P40 wording and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          editor_path = Path('src/views/EditorPage.tsx')
          editor = editor_path.read_text(encoding='utf-8')

          replacements = [
              ('setStatus("Opening PDF engine…"); setError(null);', 'setStatus("Opening PDF…"); setError(null);', 1),
              ('setStatus("Ready · loading PDF content…");', 'setStatus("Ready · finding editable content…");', 1),
              ('`${pdf.numPages} pages · Unified editor ready`', '`${pdf.numPages} pages · Editor ready`', 1),
              ('`${pdf.numPages} pages · ${inspection.totals.text + inspection.totals.images + inspection.totals.vectors + inspection.totals.tables + inspection.totals.forms} detected PDF objects · Unified editor`', '`${pdf.numPages} pages · ${inspection.totals.text + inspection.totals.images + inspection.totals.vectors + inspection.totals.tables + inspection.totals.forms} PDF items found`', 1),
              ('setWarnings((current) => [...current, `Existing-content inspection unavailable: ${inspectionError instanceof Error ? inspectionError.message : String(inspectionError)}`]);', 'setWarnings((current) => [...current, "Some existing PDF content could not be prepared for direct editing. You can still add new content."]);', 1),
              ('setStatus("Ready · overlay editing only");', 'setStatus("Ready · you can still add new content");', 1),
              ('setError("Enter the PDF password for this in-memory editing session.");', 'setError("Enter the PDF password to open it in the editor.");', 1),
              ('onTitleChange?.(`Edit · ${project?.name ?? "PDF"}`, `${document?.numPages ?? 0} pages · ${objects.length} editor objects · Unsaved export`);', 'onTitleChange?.(`Edit · ${project?.name ?? "PDF"}`, `${document?.numPages ?? 0} pages · ${objects.length} added object${objects.length === 1 ? "" : "s"} · Changes not exported`);', 1),
              ('"Image objects from another project were skipped because their local binary assets were unavailable."', '"Some pasted images were skipped because their image files are not available in this project."', 1),
              ('setProcessing(true); setError(null); setWarnings([]); setLastReport(null); setStatus("Compiling editor objects…");', 'setProcessing(true); setError(null); setWarnings([]); setLastReport(null); setStatus("Preparing edited PDF…");', 1),
              ('update({ detail: "Compiling editor objects…", progress: 0.05 });', 'update({ detail: "Preparing edited PDF…", progress: 0.05 });', 1),
              ('setStatus(`Applying ${nativeEdits.length} existing-content edits…`);', 'setStatus(`Applying ${nativeEdits.length} PDF edit${nativeEdits.length === 1 ? "" : "s"}…`);', 1),
              ('setStatus("Validating unified edited PDF…");', 'setStatus("Checking edited PDF…");', 1),
              ('update({ stage: "validating", detail: "Reopening and validating edited output…", progress: 0.82 });', 'update({ stage: "validating", detail: "Checking the edited PDF before saving…", progress: 0.82 });', 1),
              ('throw new Error(`Validation failed: expected ${document?.numPages} pages, received ${summary.pageCount}.`);', 'throw new Error("The edited PDF could not be verified because its page count changed unexpectedly.");', 1),
              ('throw new Error(`Validation failed: ${result.report.annotationCount} annotations were compiled, but only ${Math.max(0, annotationDelta)} additional annotations reopened.`);', 'throw new Error("The edited PDF could not be verified because some annotations did not save correctly.");', 1),
              ('throw new Error(`Validation failed: ${result.report.linkCount} links were compiled, but only ${Math.max(0, linkDelta)} additional links reopened.`);', 'throw new Error("The edited PDF could not be verified because some links did not save correctly.");', 1),
              ('const nativeSummary = nativeReport ? `${nativeReport.textEdits} text · ${nativeReport.imageEdits} image · ${nativeReport.vectorEdits} vector · ${nativeReport.tableCellEdits} table cells · ${nativeReport.formEdits} forms` : "0 existing-content edits";\n      setLastReport(`${nativeSummary} · ${result.report.objectCount} overlay objects · ${formatBytes(result.report.outputBytes)}`);', 'const pdfEditCount = nativeReport ? nativeReport.textEdits + nativeReport.imageEdits + nativeReport.vectorEdits + nativeReport.tableCellEdits + nativeReport.formEdits : 0;\n      setLastReport(`${pdfEditCount} PDF content edit${pdfEditCount === 1 ? "" : "s"} · ${result.report.objectCount} added object${result.report.objectCount === 1 ? "" : "s"} · ${formatBytes(result.report.outputBytes)}`);', 1),
              ('update({ stage: "committing", detail: "Saving a new project revision…", progress: 0.94 });', 'update({ stage: "committing", detail: "Saving edited PDF as a new project…", progress: 0.94 });', 1),
              ('setStatus("Export validated and downloaded");', 'setStatus("Edited PDF downloaded");', 1),
              ('const localSaveLabel = localSaveStatusLabel(localSave, lastReport, Boolean(editorState.dirty || nativeEdits.length));', 'const localSaveLabel = localSaveStatusLabel(localSave, lastReport, Boolean(editorState.dirty || nativeEdits.length));\n  const detectedPdfItemCount = nativeInspection ? nativeInspection.totals.text + nativeInspection.totals.images + nativeInspection.totals.vectors + nativeInspection.totals.tables + nativeInspection.totals.forms : 0;', 1),
              ('<span>{status} · {nativeInspection ? `${nativeInspection.totals.text + nativeInspection.totals.images + nativeInspection.totals.vectors + nativeInspection.totals.tables + nativeInspection.totals.forms} PDF + ` : ""}{history.present.objects.length} overlay objects</span>', '<span>{status}{nativeInspection ? ` · ${detectedPdfItemCount} PDF item${detectedPdfItemCount === 1 ? "" : "s"}` : ""} · ${history.present.objects.length} added object${history.present.objects.length === 1 ? "" : "s"}</span>', 1),
              ('title="Undo added-object change"', 'title="Undo last change"', 1),
              ('title="Redo added-object change"', 'title="Redo last change"', 1),
              ('{nativeEdits.length} existing-content edit{nativeEdits.length === 1 ? "" : "s"} queued', '{nativeEdits.length} PDF edit{nativeEdits.length === 1 ? "" : "s"} ready', 1),
              ('<strong>Editor report</strong>', '<strong>Editor notice</strong>', 1),
              ('<strong>No editable objects detected</strong><p>Add an object or inspect another page.</p>', '<strong>No editable items on this page</strong><p>Add something new or choose another page.</p>', 1),
              ('{object.capability.label}{queued ? ` · ${queued} queued` : ""}', '{object.capability.label}{queued ? ` · ${queued} edit${queued === 1 ? "" : "s"} ready` : ""}', 1),
              ('The password remains in memory and is passed only to the local PDF engines.', 'Your password is used only in this tab to open and edit the PDF. It is not saved.', 1),
              ('reject(new Error("The image could not be decoded."));', 'reject(new Error("PDF Studio could not read this image."));', 1),
          ]

          for old, new, expected in replacements:
              count = editor.count(old)
              if count != expected:
                  raise SystemExit(f'EditorPage replacement mismatch ({count} != {expected}): {old[:120]}')
              editor = editor.replace(old, new)
          editor_path.write_text(editor, encoding='utf-8')

          save_path = Path('src/persistence/localSaveTrust.ts')
          save = save_path.read_text(encoding='utf-8')
          save_replacements = [
              ('"Local changes waiting to save"', '"Changes waiting to save locally"'),
              ('"Saving local changes…"', '"Saving changes locally…"'),
              ('"Local changes saved"', '"Changes saved locally"'),
              ('"Local changes not yet saved"', '"Changes not yet saved locally"'),
              ('"No pending editor changes"', '"No unsaved local changes"'),
          ]
          for old, new in save_replacements:
              if save.count(old) != 1:
                  raise SystemExit(f'localSaveTrust replacement mismatch: {old}')
              save = save.replace(old, new)
          save_path.write_text(save, encoding='utf-8')

          unit_path = Path('tests/unit/localSaveTrust.test.ts')
          unit = unit_path.read_text(encoding='utf-8')
          unit_replacements = [
              ('"Local changes waiting to save"', '"Changes waiting to save locally"'),
              ('"Saving local changes…"', '"Saving changes locally…"'),
              ('"Local changes saved"', '"Changes saved locally"'),
              ('"2 overlay objects · 4.2 KB"', '"2 added objects · 4.2 KB"'),
          ]
          for old, new in unit_replacements:
              if unit.count(old) < 1:
                  raise SystemExit(f'unit replacement missing: {old}')
              unit = unit.replace(old, new)
          marker = '  it("keeps browser-exit protection while a save is unresolved", () => {'
          idle_test = '''  it("uses plain language for idle local-save state", () => {\n    expect(localSaveStatusLabel(state("idle"), null, true)).toBe("Changes not yet saved locally");\n    expect(localSaveStatusLabel(state("idle"), null, false)).toBe("No unsaved local changes");\n  });\n\n'''
          if marker not in unit:
              raise SystemExit('unit insertion marker missing')
          unit = unit.replace(marker, idle_test + marker, 1)
          unit_path.write_text(unit, encoding='utf-8')

          Path('docs/reconstruction/p40-editor-secondary-language.md').write_text('''# P40 — Editor Status & Secondary-Surface Language Cleanup\n\n## Goal\n\nFinish the normal editor-language cleanup outside the primary properties and Layers surfaces. Status text, document subtitles, progress messages, fallback notices, tooltips, empty states, local-save labels, and the protected-PDF explanation should describe what the user can do or what is happening without exposing engine, reconstruction, overlay, queue, revision, or validation-pipeline vocabulary.\n\n## Scope\n\nP40 changes presentation copy in `EditorPage` and the shared local-save status labels. It also updates the local-save unit expectations and adds browser/source regression coverage.\n\nNormal surfaces now use these concepts:\n\n- `Opening PDF` rather than opening a PDF engine;\n- `finding editable content` rather than loading/inspecting implementation objects;\n- `PDF items` and `added objects` rather than unified/native/overlay object language;\n- `PDF edits ready` rather than queued existing-content edits;\n- `Preparing`, `Checking`, and `Saving` the edited PDF rather than compiling, reopening, validating, or creating a project revision;\n- concise user-facing verification failures instead of pipeline counts;\n- local-save wording centered on whether changes are saved locally;\n- a protected-PDF explanation that says the password stays in the tab and is not saved.\n\n## Product boundary\n\nNo PDF inspection, capability scoring, selection, geometry, object ordering, native-edit routing, clipboard behavior, persistence semantics, password handling, export bytes, validation rules, undo/redo behavior, or project lineage behavior changes. Internal identifiers such as `native*`, `overlay*`, `unified*`, the `unified-editor` source key, worker names, and test selectors remain valid engineering vocabulary.\n\n## Qualification\n\nP40 regression coverage verifies the normal editor header/status surfaces after opening and editing the sample, verifies the local-save and export-result language, and statically rejects the retired user-facing phrases in source. Full repository CI, browser regression, Consumer performance budget, and R10 operational readiness remain the merge gate.\n''', encoding='utf-8')

          Path('docs/reconstruction/p40-acceptance-matrix.md').write_text('''# P40 Acceptance Matrix\n\n| ID | Requirement | Evidence / gate |\n| --- | --- | --- |\n| P40-UX-01 | Startup/readiness surfaces do not expose PDF-engine or Unified-editor language. | `p40-editor-secondary-language.spec.ts` |\n| P40-UX-02 | Header/subtitle counts describe PDF items and added objects without overlay/editor-object terminology. | Browser regression |\n| P40-UX-03 | Existing-PDF edit readiness uses plain `PDF edit(s) ready` language rather than queue terminology. | Source audit + browser regression |\n| P40-UX-04 | Export progress/result copy uses Prepare / Check / Save / Download language rather than compile/validate/revision vocabulary. | Source audit + export browser regression |\n| P40-UX-05 | Local-save labels use consistent `saved locally` language. | `localSaveTrust.test.ts` + browser regression |\n| P40-UX-06 | Empty-state, warning-banner, paste-image, image-read, undo/redo, and protected-PDF secondary copy is plain user language. | Source audit |\n| P40-SAFE-01 | No inspection, editing, persistence, password, export-byte, validation-rule, or project-lineage behavior changes. | Diff review + full CI |\n| P40-PERF-01 | Consumer performance budget remains green. | Consumer performance workflow |\n| P40-OPS-01 | Operational-readiness policy remains green. | R10 workflow |\n\n## Merge gate\n\nMerge only when PDF Studio CI, including browser regression, Consumer performance budget, and R10 operational-readiness all succeed on the final branch head.\n''', encoding='utf-8')

          Path('tests/e2e/p40-editor-secondary-language.spec.ts').write_text('''import { readFileSync } from "node:fs";\nimport { join } from "node:path";\nimport { expect, test } from "@playwright/test";\n\nasync function openEditor(page: import("@playwright/test").Page): Promise<void> {\n  await page.goto("./#/home");\n  await page.getByRole("button", { name: "Open sample" }).click();\n  await expect(page).toHaveURL(/#\\/workspace\\/[^/]+\\/viewer/);\n  await page.getByRole("button", { name: "Edit", exact: true }).click();\n  await expect(page).toHaveURL(/\\/editor$/);\n  await expect(page.getByRole("button", { name: /Select existing image:/ }).first()).toBeVisible({ timeout: 20_000 });\n}\n\nasync function addRectangle(page: import("@playwright/test").Page): Promise<void> {\n  await page.getByRole("button", { name: "Rectangle", exact: true }).click();\n  const canvas = page.locator(".editor-page-layers");\n  const box = await canvas.boundingBox();\n  expect(box).not.toBeNull();\n  if (!box) return;\n  await page.mouse.move(box.x + 40, box.y + 40);\n  await page.mouse.down();\n  await page.mouse.move(box.x + 150, box.y + 105, { steps: 4 });\n  await page.mouse.up();\n}\n\ntest("editor status and secondary surfaces use product language", async ({ page }) => {\n  await openEditor(page);\n\n  const fileGroup = page.locator(".editor-file-group");\n  await expect(fileGroup).toContainText(/Ready · \\d+ PDF items? · 0 added objects/);\n  await expect(fileGroup).not.toContainText(/PDF engine|Unified editor|overlay objects|Unsaved export|existing-content/i);\n\n  await addRectangle(page);\n  await expect(fileGroup).toContainText("1 added object");\n  await expect(page.locator(".editor-contextbar strong")).toHaveText("Changes saved locally", { timeout: 10_000 });\n\n  const downloadPromise = page.waitForEvent("download");\n  await page.getByRole("button", { name: "Download PDF" }).click();\n  await downloadPromise;\n  await expect(fileGroup).toContainText("Edited PDF downloaded");\n  await expect(page.locator(".editor-contextbar strong")).toContainText(/0 PDF content edits · 1 added object · /);\n});\n\ntest("retired engineering phrases do not remain in normal editor copy", async () => {\n  const editor = readFileSync(join(process.cwd(), "src/views/EditorPage.tsx"), "utf8");\n  const localSave = readFileSync(join(process.cwd(), "src/persistence/localSaveTrust.ts"), "utf8");\n  const retiredEditorPhrases = [\n    "Opening PDF engine",\n    "Unified editor ready",\n    "detected PDF objects · Unified editor",\n    "Existing-content inspection unavailable",\n    "overlay editing only",\n    "in-memory editing session",\n    "editor objects · Unsaved export",\n    "local binary assets were unavailable",\n    "Compiling editor objects",\n    "existing-content edits",\n    "Validating unified edited PDF",\n    "Reopening and validating edited output",\n    "0 existing-content edits",\n    "overlay objects",\n    "Saving a new project revision",\n    "Export validated and downloaded",\n    "Undo added-object change",\n    "Redo added-object change",\n    "existing-content edit",\n    "Editor report",\n    "No editable objects detected",\n    " · ${queued} queued",\n    "local PDF engines",\n    "could not be decoded"\n  ];\n  for (const phrase of retiredEditorPhrases) expect(editor).not.toContain(phrase);\n\n  for (const phrase of [\n    "Local changes waiting to save",\n    "Saving local changes",\n    "Local changes saved",\n    "Local changes not yet saved",\n    "No pending editor changes"\n  ]) expect(localSave).not.toContain(phrase);\n});\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/EditorPage.tsx src/persistence/localSaveTrust.ts tests/unit/localSaveTrust.test.ts tests/e2e/p40-editor-secondary-language.spec.ts docs/reconstruction/p40-editor-secondary-language.md docs/reconstruction/p40-acceptance-matrix.md
          git commit -m "P40 clean up editor secondary language [p40-applied]"
          git push origin HEAD:ux/p40-editor-secondary-language
