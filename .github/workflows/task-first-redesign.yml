name: Task-first redesign verification
on:
  push:
    branches: [redesign/task-first-experience]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-first-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Materialize locally verified redesign source once
        run: |
          set -eu
          if [ -f scripts/redesign-bootstrap/apply.py ]; then
            python3 scripts/redesign-bootstrap/apply.py
            rm scripts/redesign-bootstrap/apply.py scripts/redesign-bootstrap/quick.py scripts/redesign-bootstrap/editor.py
            git add src/views/QuickToolPage.tsx src/views/EditorPage.tsx src/workspace/UnifiedWorkspace.tsx src/main.tsx src/App.tsx tests/e2e/everyday-workflows.spec.mjs scripts/redesign-bootstrap
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: replace tabbed workspaces with focused PDF tasks and direct document editing'
            git push origin HEAD:refs/heads/redesign/task-first-experience
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare reproducible review snapshot
        run: git archive --format=tar HEAD > /tmp/pdf-redesign-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-redesign-review
          path: /tmp/pdf-redesign-source.tar
          retention-days: 2
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Redesign and real-file regression tests
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test tests/e2e/task-first-redesign.spec.mjs tests/e2e/everyday-workflows.spec.mjs --project=chromium --project=firefox --project=webkit --workers=2 --retries=0 --max-failures=8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-redesign-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
