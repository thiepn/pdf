name: D4 real editor layer transactions

on:
  pull_request:
    paths:
      - src/views/EditorPage.tsx
      - src/product/studio-layers-d4-live.css
      - src/product/product.css
      - tests/e2e/d4-live-layer-transactions.spec.ts
      - .github/workflows/d4-live-layers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d4-live-layers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify real editor transactions and undo
        run: npx playwright test tests/e2e/d4-live-layer-transactions.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - name: Preserve screenshots and error traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d4-live-layers-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
