name: D15 fidelity regression and release evidence

on:
  pull_request:
    paths:
      - .github/workflows/d15-regression-evidence.yml
      - src/workers/native-image.worker.ts
      - src/native/nativeImageEvidence.ts
      - tests/unit/nativeImageEvidenceD15.test.ts
      - tests/unit/p17DeepNativeFidelity.test.ts
      - tests/e2e/d14-native-export.spec.mjs
      - tests/e2e/p17-native-fidelity.spec.ts
      - tests/e2e/d10-editor-status.spec.mjs
      - tests/e2e/p40-editor-secondary-language.spec.ts
      - tests/e2e/p42-advanced-tools-progressive-disclosure.spec.ts
      - scripts/design/d15_evidence_inventory.py
      - tests/d15_evidence_inventory_test.py
      - docs/design/D15_RELEASE_EVIDENCE_STATUS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify D8 evidence inventory without approving it
        run: |
          python3 -m unittest discover -s tests -p d15_evidence_inventory_test.py -v
          python3 -m scripts.design.d15_evidence_inventory
      - name: Validate D15 real-image geometry evidence
        run: npx vitest run tests/unit/nativeImageEvidenceD15.test.ts tests/unit/p17DeepNativeFidelity.test.ts
      - name: Compile the actual app
        run: npm run typecheck
      - name: Build verified browser output
        run: npm run build

  browser-evidence:
    needs: verified-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real PDF native mask export and independent reopening
        run: npx playwright test tests/e2e/p17-native-fidelity.spec.ts tests/e2e/d14-native-export.spec.mjs tests/e2e/d13-release-candidate.spec.mjs tests/e2e/d10-editor-status.spec.mjs tests/e2e/p40-editor-secondary-language.spec.ts tests/e2e/p42-advanced-tools-progressive-disclosure.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: d15-native-evidence-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
