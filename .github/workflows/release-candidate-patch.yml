name: Prepare verified release fixes
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/release-candidate-patch.yml, scripts/release-candidate-edits.json]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Apply exact source changes with before and after checksums
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          changes = json.loads(pathlib.Path('scripts/release-candidate-edits.json').read_text())
          for change in changes:
              path = pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if str(path) == 'src/views/ViewerPage.tsx':
                  assert change['edits'][-1] == [13468, 13661, ')} ']
                  change['edits'][-1][2] = ')}'
              text = path.read_text() if path.exists() else ''
              assert hashlib.sha256(text.encode()).hexdigest() == change['before'], str(path) + ' baseline mismatch'
              for start, end, replacement in reversed(change['edits']):
                  text = text[:start] + replacement + text[end:]
              assert hashlib.sha256(text.encode()).hexdigest() == change['after'], str(path) + ' output mismatch'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          pathlib.Path('scripts/release-candidate-edits.json').unlink()
          pathlib.Path('.github/workflows/release-candidate-patch.yml').unlink()
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run test:runtime:phase29 && npm run test:runtime:v6.1.0
      - name: Stage only the candidate source
        run: |
          git add -A
          git diff --cached --binary > /tmp/candidate.patch
          git diff --cached --name-status > /tmp/candidate-files.txt
          tar --exclude=node_modules --exclude=.git --exclude=test-results --exclude=playwright-report -czf /tmp/candidate-source.tar.gz .
      - name: Create candidate commit without moving the branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const {owner,repo} = context.repo;
            const head = (await github.rest.git.getCommit({owner,repo,commit_sha:context.sha})).data;
            const names = cp.execFileSync('git',['diff','--cached','--name-only','-z']).toString().split('\0').filter(Boolean);
            const entries = [];
            const checksums = {};
            for (const path of names) {
              if (!fs.existsSync(path)) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
              const bytes = fs.readFileSync(path);
              checksums[path] = require('crypto').createHash('sha256').update(bytes).digest('hex');
              const blob = await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'});
              entries.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const tree = await github.rest.git.createTree({owner,repo,base_tree:head.tree.sha,tree:entries});
            const commit = await github.rest.git.createCommit({owner,repo,message:'fix: preserve current edits through keyboard tool search and qualify reader controls',tree:tree.data.sha,parents:[context.sha]});
            fs.writeFileSync('/tmp/candidate-commit.json',JSON.stringify({parent:context.sha,sha:commit.data.sha,tree:tree.data.sha,checksums},null,2));
            await core.summary.addHeading('Candidate only — branch not updated').addRaw(commit.data.sha).write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-release-candidate
          path: |
            /tmp/candidate-commit.json
            /tmp/candidate.patch
            /tmp/candidate-files.txt
            /tmp/candidate-source.tar.gz
          retention-days: 3
