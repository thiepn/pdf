name: Preview correctness and release checks
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/apply-preview-polish.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'fa5f26f116c78bb846d619f8da97e1e863abc04dcbe17c65aeea4621ca2a13d6'
          Path('/tmp/preview.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/preview.patch
          git apply --unidiff-zero --index /tmp/preview.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 16
          git rm .github/workflows/apply-preview-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: true comparison changes, live form previews and precise crop submission'
          test "$(git ls-remote origin refs/heads/redesign/task-first-experience | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/redesign/task-first-experience
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement requirements-phase11.txt
      - run: sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends fonts-noto-core
      - run: npm ci --no-audit --no-fund
      - name: Capture exact source and implementation revision
        run: |
          git archive --format=tar.gz HEAD > /tmp/pdf-preview-source.tar.gz
          git rev-parse HEAD > /tmp/pdf-preview-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-preview-source
          path: /tmp/pdf-preview-*
          retention-days: 3
      - name: Run complete non-browser release gate
        run: npm run release:web
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Check real-file task workflows without retries
        run: PLAYWRIGHT_SKIP_BUILD=1 npx playwright test tests/e2e/task-first- tests/e2e/everyday-workflows.spec.mjs --project=chromium --project=firefox --project=webkit --workers=2 --retries=0 --max-failures=8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-preview-browser-evidence
          path: |
            playwright-report/
            test-results/
            source-audit-report.json
            docs/phase-11/corpus-validation-report.json
            docs/phase-28/adversarial-corpus-report.json
          retention-days: 7
