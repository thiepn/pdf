name: F4 structure-preserving optimizer qualification
on:
  pull_request:
    paths:
      - "src/optimization/**"
      - "src/preservation/**"
      - "src/workers/preservation.worker.ts"
      - "src/views/CompressionPage.tsx"
      - "tests/unit/f4SmartOptimizer.test.ts"
      - "tests/e2e/f4-smart-optimizer.spec.mjs"
      - ".github/workflows/f4-smart-optimizer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Test preservation decisions and fingerprints
        id: tests
        continue-on-error: true
        run: npx vitest run tests/unit/f4SmartOptimizer.test.ts tests/unit/preservationFingerprint.test.ts tests/unit/pdfFidelity.test.ts
      - name: Build production
        id: build
        continue-on-error: true
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser optimization and safe PDF download
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: "/pdf/"
        run: npx playwright test tests/e2e/f4-smart-optimizer.spec.mjs --project=chromium --workers=1 --retries=0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f4-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Require all F4 checks
        if: always()
        run: |
          echo "types=${{ steps.types.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}"
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
