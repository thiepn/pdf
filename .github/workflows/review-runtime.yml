name: Isolated review runtime
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/review-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: tar -czf /tmp/pdf-review-runtime.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-review-runtime
          path: /tmp/pdf-review-runtime.tgz
          retention-days: 1
