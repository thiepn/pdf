name: F3 review and measurement qualification

on:
  pull_request:
    paths:
      - "src/review/**"
      - "src/editor/**"
      - "src/types/editor.ts"
      - "src/views/EditorPage.tsx"
      - "src/workers/editor-export.worker.ts"
      - "src/ia/taskCatalog.ts"
      - "src/workspace/UnifiedWorkspace.tsx"
      - "tests/unit/f3ReviewMeasurement.test.ts"
      - ".github/workflows/f3-review-measurement.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Run review and measurement PDF round trips
        id: unit
        continue-on-error: true
        run: npx vitest run tests/unit/f3ReviewMeasurement.test.ts tests/unit/editorModel.test.ts tests/unit/pdfFidelity.test.ts
      - name: Build production
        id: build
        continue-on-error: true
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser review-and-measurement export round trip
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: "/pdf/"
        run: npx playwright test tests/e2e/f3-review-measurement.spec.mjs --project=chromium --workers=1 --retries=0
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f3-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Require F3 gates
        if: always()
        run: |
          echo "Typecheck=${{ steps.types.outcome }} unit=${{ steps.unit.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}"
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
