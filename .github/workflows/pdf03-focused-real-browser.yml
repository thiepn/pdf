name: PDF-03 focused real-browser fidelity qualification (non-release)

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/pdf04-security-lock.yml
      - .github/workflows/ci.yml
      - .github/workflows/pdf03-focused-real-browser.yml
      - .github/workflows/d19-release-acceptance.yml
      - src/workers/native-image.worker.ts
      - src/native/nativeImageEvidence.ts
      - tests/unit/pdf03NativeWorkerInspection.test.ts
      - tests/unit/d18NativeGeometryRoundTrip.test.ts
      - tests/e2e/pdf03-device-lifecycle.spec.ts
      - tests/e2e/p17-native-fidelity.spec.ts
      - tests/e2e/d14-native-export.spec.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf03-focused-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  actual-worker-and-guard-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact unmerged source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real MuPDF worker classification and original strict negative cases
        run: npx vitest run tests/unit/pdf03NativeWorkerInspection.test.ts tests/unit/d18NativeGeometryRoundTrip.test.ts tests/unit/nativeImageEvidenceD15.test.ts tests/unit/p17DeepNativeFidelity.test.ts
      - run: npm run typecheck

  actual-browsers:
    needs: actual-worker-and-guard-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact unmerged source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real four-image masked source selection and independent downloaded-PDF reopen
        run: npx playwright test tests/e2e/pdf03-device-lifecycle.spec.ts tests/e2e/p17-native-fidelity.spec.ts tests/e2e/d14-native-export.spec.mjs --project=${{ matrix.browser }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf03-real-browser-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
