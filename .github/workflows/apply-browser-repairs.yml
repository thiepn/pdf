name: Browser repair verification
on:
  push:
    branches: [redesign/task-first-experience]
    paths: [.github/workflows/apply-browser-repairs.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'thiepn/pdf' && github.ref == 'refs/heads/redesign/task-first-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: commit
        name: Apply reviewed patch, remove this temporary workflow, fast-forward feature branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '145d1d671c5db0b50d43d416da8d5d59190f8890e43026b3f1f77720105ec703'
          Path('/tmp/browser-repairs.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/browser-repairs.patch
          git apply --unidiff-zero --index /tmp/browser-repairs.patch
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git rm .github/workflows/apply-browser-repairs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: real form safety evidence, crop lifecycle and immediate text editing'
          test "$(git ls-remote origin refs/heads/redesign/task-first-experience | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/redesign/task-first-experience
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run test:unit
      - run: node scripts/source-audit.mjs && node scripts/phase25/runtime-regression.mjs && node scripts/phase26/runtime-regression.mjs && node scripts/phase29/runtime-regression.mjs && node scripts/releases/v6.1.0/runtime-regression.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: PLAYWRIGHT_SKIP_BUILD=1 npx playwright test tests/e2e/task-first- tests/e2e/everyday-workflows.spec.mjs --project=chromium --project=firefox --project=webkit --workers=2 --retries=0 --max-failures=8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-browser-repairs-evidence
          path: |
            playwright-report/
            test-results/
            source-audit-report.json
          retention-days: 7
