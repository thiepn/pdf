name: F5 headless action registry qualification
on:
  pull_request:
    paths:
      - "src/actions/**"
      - "src/processing/batchPipeline.ts"
      - "src/quick/quickOperations.ts"
      - "tests/unit/f5*.test.ts"
      - "tests/e2e/f5-headless-actions.spec.mjs"
      - ".github/workflows/f5-headless-actions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Validate contracts, runner and batch regressions
        id: tests
        continue-on-error: true
        run: npx vitest run tests/unit/f5ActionCatalog.test.ts tests/unit/f5ActionRunner.test.ts tests/unit/batchOutputFingerprint.test.ts tests/unit/batchOutputValidity.test.ts
      - name: Build production
        id: build
        continue-on-error: true
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser integration through quick tools
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_BASE_PATH: "/pdf/"
        run: npx playwright test tests/e2e/f5-headless-actions.spec.mjs --project=chromium --workers=1 --retries=0
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f5-headless-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Require F5 qualification
        if: always()
        run: |
          echo "types=${{ steps.types.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}"
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
